<section id="hero" class="hero-section">
  <!-- Hero Background Layer -->
  <div class="hero-bg-layer">
    <video 
      #heroVideo 
      autoplay 
      muted 
      loop 
      playsinline 
      preload="auto"
      class="hero-bg-image" 
      poster="/images/hero-drone-shot.jpg">
      <source src="/images/hero-drone.mp4" type="video/mp4" />
    </video>
  </div>

  <div class="container hero-container">
    <!-- Hero Text Content -->
    <div class="hero-content">
      <div class="hero-brand-badge">
        <i class="ri-shield-check-fill text-gold"></i>
        <span>{{ adminService.websiteContent().heroBadge }}</span>
      </div>

      <h1 class="hero-title">
        {{ adminService.websiteContent().heroHeading }}
      </h1>

      <p class="hero-statement">
        {{ adminService.websiteContent().heroSubheading }}
      </p>

      <!-- Action Buttons -->
      <div class="hero-cta-group">
        <a routerLink="/properties" class="btn btn-gold btn-lg">
          <i class="ri-compass-3-line"></i>
          <span>{{ adminService.websiteContent().heroCtaExplore }}</span>
        </a>

        <button class="btn btn-outline-gold btn-lg" (click)="openInspection()">
          <i class="ri-calendar-check-line"></i>
          <span>{{ adminService.websiteContent().heroCtaInspection }}</span>
        </button>

        <button class="btn btn-whatsapp btn-lg" (click)="openWhatsApp()">
          <i class="ri-whatsapp-line"></i>
          <span>{{ adminService.websiteContent().heroCtaWhatsapp }}</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Modern Minimalist Scroll Animation Icon -->
  <button 
    type="button" 
    class="hero-scroll-icon-btn" 
    (click)="scrollDown()" 
    title="Scroll to explore"
    aria-label="Scroll down to explore featured properties">
    <div class="scroll-mouse-track">
      <span class="scroll-wheel-pip"></span>
    </div>
    <div class="scroll-arrow-trail">
      <i class="ri-arrow-down-s-line"></i>
    </div>
    <span class="scroll-down-text">Scroll Down</span>
  </button>
</section>
