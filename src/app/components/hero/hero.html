<section id="hero" class="hero-section">
  <!-- Hero Background Layer -->
  <div class="hero-bg-layer">
    <video 
      #heroVideo 
      autoplay 
      muted 
      loop 
      playsinline 
      preload="auto"
      class="hero-bg-image">
      <source src="/images/hero-drone.mp4" type="video/mp4" />
    </video>
    <div class="hero-gradient-overlay"></div>
  </div>

  <div class="container hero-container">
    <!-- Hero Text Content -->
    <div class="hero-content">
      <h1 class="hero-title">
        {{ adminService.websiteContent().heroHeading }}
      </h1>

      <p class="hero-statement">
        {{ adminService.websiteContent().heroSubheading }}
      </p>

    </div>
  </div>

  <!-- Modern Minimalist Scroll Animation Icon -->
  <button 
    type="button" 
    class="hero-scroll-icon-btn" 
    (click)="scrollDown()" 
    title="Scroll to explore"
    aria-label="Scroll down to explore featured properties">
    <div class="scroll-mouse-track">
      <span class="scroll-wheel-pip"></span>
    </div>
    <div class="scroll-arrow-trail">
      <i class="ri-arrow-down-s-line"></i>
    </div>
    <span class="scroll-down-text">Scroll Down</span>
  </button>
</section>
